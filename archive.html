/* ── 헤더 ── */
.arc-header {

.arc-card-label {

  color: var(--krds-text-tertiary); padding-top: 1px;

.arc-card-val { color: var(--krds-text-primary); }
.arc-card-rec {
  position: relative;
  background: rgba(34,135,56,.06);
  border-radius: 6px;
  padding: 8px 12px 8px 26px;
  margin-top: 10px;
}
.arc-card-rec::before {
  content: ''; position: absolute; left: 8px; top: 50%;
  transform: translateY(-50%); width: 6px; height: 6px;
  border-radius: 50%; background: var(--success);
}
[data-theme="dark"] .arc-card-rec { background: rgba(63,185,80,.06); }
.arc-card-rec .arc-card-label { color: var(--success); }
.arc-card-rec .arc-card-val { color: var(--krds-text-primary); }

/* ── 로딩 / 빈 상태 ── */
.arc-state {

  color: var(--krds-text-tertiary); font-size: .9rem;

.arc-loading-dots { display: inline-flex; gap: 5px; }
.arc-loading-dots span {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--krds-color-primary); opacity: .4;
  animation: dot-pulse 1.2s infinite;
}
.arc-loading-dots span:nth-child(2) { animation-delay: .2s; }
.arc-loading-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes dot-pulse { 0%,80%,100%{opacity:.2} 40%{opacity:.9} }

/* ── 반응형 ── */
@media (max-width: 600px) {

  .arc-search { max-width: none; }
  .arc-result-count { margin-left: 0; }
  .gnb-nav { display: none; }
}

/* ── 스킵 링크 ── */
.skip-link {

/* ── 인쇄 ── */
@media print {

  body { color: #000; background: #fff; }
  @page { margin: 2cm; }

/* ── prefers-reduced-motion ── */

  .arc-card, .arc-tab, .arc-search, .gnb-theme-btn { transition: none; }
}
