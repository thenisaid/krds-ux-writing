name: KRDS UX 라이팅 린팅 (CLI)

# PR 시 자동 실행 — UX Writing 품질 게이트
# @krds/cli (bin/krds-lint) 를 사용하여 변경된 파일을 검사합니다.
#
# ✅ PR 열기 / 커밋 추가 시 자동 실행
# ❌ 이 PR 이 "새로 만든" 오류가 1건 이상이면 exit 1 → CI 실패 → 머지 차단
#    (파일별로 base 와 PR 의 린트 결과를 (category, match) 다중집합으로 비교.
#     base 에 이미 있던 오류는 참고용으로만 보고하고 게이트에 쓰지 않는다.
#     비교 불가 상태(base 린트 실패·파싱 실패 등)는 통과가 아니라 FAIL.)
# 💬 린트 결과를 PR 코멘트로 자동 게시 (이전 코멘트는 업데이트)
#
# workflow_dispatch(전체/target_file 검사)는 base 가 없으므로 기존처럼 오류 절대 총합 기준.
# 판정 로직: scripts/lint-delta.js (단위 테스트: tests/lint-delta.test.js)
# 파일별 루프: scripts/lint-delta-run.sh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**.md'
      - '**.txt'
      - '**.html'
  workflow_dispatch:
    inputs:
      target_file:
        description: '검사할 파일 경로 (기본: 전체 md/txt/html)'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pull-requests: write  # PR 코멘트 게시에 필요

jobs:
  krds-lint:
    name: KRDS UX 라이팅 검사
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # 변경 파일 감지 + base 쪽 파일 조회를 위해 전체 히스토리 필요

      - name: Node.js 설정
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 의존성 설치
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline
          else
            npm install
          fi

      - name: 유닛 테스트 실행
        run: npm test

      - name: bin/krds-lint 실행 권한 부여
        run: chmod +x bin/krds-lint scripts/lint-delta-run.sh

      - name: 변경된 파일 목록 수집
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR 이벤트: base..head 사이 변경된 파일만 검사
            git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -E '\.(md|txt|html)$' \
              | grep -v 'node_modules' \
              > /tmp/changed_files.txt || true
          else
            # workflow_dispatch: 수동 지정 또는 전체 검사
            if [ -n "${{ inputs.target_file }}" ]; then
              echo "${{ inputs.target_file }}" > /tmp/changed_files.txt
            else
              find . -name '*.md' -o -name '*.txt' -o -name '*.html' \
                | grep -v 'node_modules' | grep -v '\.git' \
                > /tmp/changed_files.txt
            fi
          fi

          # 린트 제외: 기술 용어·표·코드 위주의 설계 문서라 UX 문구 린터 대상이 아님.
          # 와일드카드·디렉터리 제외 없이 명시적 파일 경로(전체 일치)만 거른다.
          # PR 경로·workflow_dispatch(전체/target_file) 경로 모두 여기서 걸러진다.
          sed 's#^\./##' /tmp/changed_files.txt \
            | grep -vxF -e 'TRD.md' -e 'DESIGN.md' -e 'design-guide.md' \
            > /tmp/changed_files.filtered || true
          mv /tmp/changed_files.filtered /tmp/changed_files.txt

          echo "변경된 검사 대상 파일:"
          cat /tmp/changed_files.txt || echo "(없음)"
          FILE_COUNT=$(wc -l < /tmp/changed_files.txt | tr -d ' ')
          echo "file_count=$FILE_COUNT" >> $GITHUB_OUTPUT

      - name: KRDS 린팅 실행 (CLI, 신규 오류 판정)
        id: lint
        env:
          LINT_FILE_LIST: /tmp/changed_files.txt
          # PR 이면 base 와 비교(delta 모드), 아니면 비워 두어 전체 절대 총합 기준(기존 동작)
          LINT_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bash scripts/lint-delta-run.sh

      - name: PR 코멘트 게시
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          LINT_NEW_ERRORS: ${{ steps.lint.outputs.new_errors }}
          LINT_EXISTING_ERRORS: ${{ steps.lint.outputs.existing_errors }}
          LINT_TOTAL_WARNINGS: ${{ steps.lint.outputs.total_warnings }}
          LINT_FAIL_COUNT: ${{ steps.lint.outputs.fail_count }}
          LINT_FILE_COUNT: ${{ steps.changed-files.outputs.file_count }}
          LINT_REPORT: ${{ steps.lint.outputs.report }}
        with:
          script: |
            const newErrors = parseInt(process.env.LINT_NEW_ERRORS || '0');
            const existingErrors = parseInt(process.env.LINT_EXISTING_ERRORS || '0');
            const totalWarnings = parseInt(process.env.LINT_TOTAL_WARNINGS || '0');
            const failCount = parseInt(process.env.LINT_FAIL_COUNT || '0');
            const fileCount = parseInt(process.env.LINT_FILE_COUNT || '0');
            // 린트 단계가 출력값 없이 죽은 경우를 "이슈 없음"으로 오해하지 않도록 outcome 도 본다
            const stepCrashed = process.env.LINT_OUTCOME === 'failure' && newErrors === 0;
            let report = process.env.LINT_REPORT || '';
            // 코멘트 길이 제한(65536자) 대비
            if (report.length > 50000) report = report.slice(0, 50000) + '\n\n... (길이 제한으로 이하 생략)';

            const blocked = newErrors > 0 || stepCrashed;
            const statusIcon = blocked ? '❌' : totalWarnings > 0 ? '⚠️' : '✅';
            const statusText = stepCrashed
              ? '린트 단계가 비정상 종료되어 판정할 수 없음 — 워크플로 로그 확인 필요'
              : newErrors > 0
                ? `이 PR 이 새로 만든 오류 **${newErrors}건** — 머지 전 수정 필요`
                : totalWarnings > 0
                  ? `신규 오류 없음 (경고 **${totalWarnings}건** — 검토 권장)`
                  : '신규 오류 없음';

            const body = [
              `## ${statusIcon} KRDS UX 라이팅 린팅 결과`,
              '',
              `| 항목 | 결과 |`,
              `|------|------|`,
              `| 검사 파일 수 | ${fileCount}개 |`,
              `| 신규 오류 (이 PR 이 만든 것, 게이트 기준) | ${newErrors}건 |`,
              `| 기존 오류 (base 에 이미 있음, 참고) | ${existingErrors}건 |`,
              `| 경고 | ${totalWarnings}건 |`,
              ...(failCount > 0 ? [`| 비교 불가(FAIL) 파일 | ${failCount}개 |`] : []),
              `| 상태 | ${statusText} |`,
              '',
              ...(report && report.trim() ? [
                '<details>',
                '<summary>📋 상세 결과 펼치기 (파일별 기존/신규, 신규 오류만 나열)</summary>',
                '',
                report.trim(),
                '',
                '</details>',
                '',
              ] : []),
              `> 📖 [KRDS UX 라이팅 가이드](https://thenisaid.github.io/krds-ux-writing/) · [린터 도구](https://thenisaid.github.io/krds-ux-writing/lint.html)`,
              `> 🤖 \`@krds/cli\` (bin/krds-lint) — 파일별 base 대비 신규 오류만 게이트합니다. [IND-182](/IND/issues/IND-182)`,
            ].join('\n');

            // 기존 봇 코멘트 찾기 (업데이트 또는 새 코멘트)
            const marker = '<!-- krds-lint-comment -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
              console.log('기존 KRDS 린팅 코멘트를 업데이트했습니다.');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
              console.log('새 KRDS 린팅 코멘트를 게시했습니다.');
            }

      - name: 워크플로우 요약 작성
        if: always()
        env:
          LINT_MODE: ${{ steps.lint.outputs.mode }}
          LINT_REPORT: ${{ steps.lint.outputs.report }}
        run: |
          {
            echo "## KRDS UX 라이팅 린팅 결과"
            echo ""
            echo "| 항목 | 결과 |"
            echo "|------|------|"
            echo "| 판정 모드 | ${LINT_MODE:-(미실행)} |"
            echo "| 검사 파일 수 | ${{ steps.changed-files.outputs.file_count }}개 |"
            echo "| 신규 오류 (게이트 기준) | ${{ steps.lint.outputs.new_errors }}건 |"
            echo "| 기존 오류 (참고) | ${{ steps.lint.outputs.existing_errors }}건 |"
            echo "| 경고 | ${{ steps.lint.outputs.total_warnings }}건 |"
            echo "| 비교 불가(FAIL) 파일 | ${{ steps.lint.outputs.fail_count }}개 |"
            echo ""
            if [ -n "$LINT_REPORT" ]; then
              echo "$LINT_REPORT"
              echo ""
            fi
            echo "📖 [KRDS UX 라이팅 린터](https://thenisaid.github.io/krds-ux-writing/lint.html)"
          } >> $GITHUB_STEP_SUMMARY
