<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-4XwdVnJVmjRqK4pFyEyRrus4Hkg5KnQ6LBzuiwRrR5k=' 'sha256-FeSoA/No8+P70p2XbER/08Hebov2wRXB2Nd3sBz6LDA='; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net; img-src 'self'; connect-src 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRDS 온톨로지 질문하기</title>
<script>(function(){try{var t=localStorage.getItem('krds-theme');var d=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'));}catch(e){}})();</script>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-gov.min.css" rel="stylesheet" crossorigin="anonymous">
<style>
:root{--bg:#f8f7f5;--card:#fff;--text:#1e2124;--text-muted:#5a6270;--accent:#256ef4;--border:#e4e2df;--radius:12px;--font:'Pretendard GOV Variable',Pretendard,system-ui,sans-serif}
[data-theme="dark"]{--bg:#1e2124;--card:#262b30;--text:#f0f2f5;--text-muted:#9ea8b3;--border:#333a42}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
header{position:sticky;top:0;z-index:100;background:rgba(248,247,245,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);height:60px;display:flex;align-items:center;padding:0 24px;gap:12px}
[data-theme="dark"] header{background:rgba(30,33,36,.92)}
.logo-mark{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-text{font-size:14px;font-weight:700;color:var(--text);text-decoration:none}
nav{display:flex;gap:2px;margin-left:auto;align-items:center}
nav a{font-size:13px;font-weight:500;color:var(--text-muted);text-decoration:none;padding:6px 10px;border-radius:6px;transition:.15s}
nav a:hover{background:var(--border);color:var(--text)}
nav a.active{color:var(--accent);font-weight:600}
main{max-width:860px;margin:0 auto;padding:40px 24px}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.subtitle{color:var(--text-muted);font-size:15px;margin-bottom:32px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.card-title{font-size:14px;font-weight:700;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;transition:.15s;color:var(--text-muted)}
.chip:hover,.chip.active{border-color:var(--accent);color:var(--accent);background:#eef4ff20}
[data-theme="dark"] .chip.active{background:#1a2e5420}
textarea{width:100%;border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);resize:vertical;min-height:80px;outline:none;transition:.15s}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,110,244,.12)}
.btn-row{display:flex;gap:10px;margin-top:12px;align-items:center}
.btn-primary{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 22px;font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;min-height:44px;display:flex;align-items:center;gap:6px}
.btn-primary:hover{background:#1e5fd8}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-sec{background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:8px;padding:10px 16px;font-family:var(--font);font-size:13px;cursor:pointer;transition:.15s;min-height:44px}
.btn-sec:hover{background:var(--border)}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:20px;display:none}
.result-card.visible{display:block}
.result-text{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap;min-height:60px}
.status{font-size:12px;color:var(--text-muted);margin-top:12px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#10b981;flex-shrink:0}
.dot.loading{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.examples{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.example{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:13px;cursor:pointer;transition:.15s;text-align:left;color:var(--text-muted)}
.example:hover{border-color:var(--accent);color:var(--text)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;text-align:center}
.stat-num{font-size:22px;font-weight:800;color:var(--accent)}
.stat-lbl{font-size:11px;color:var(--text-muted);margin-top:2px}
footer{text-align:center;padding:32px 24px;color:var(--text-muted);font-size:12px;border-top:1px solid var(--border)}
</style>
</head>
<body>
<header>
  <div class="logo-mark" aria-hidden="true">K</div>
  <a href="./index.html" class="logo-text">KRDS</a>
  <nav>
    <a href="./index.html">홈</a>
    <a href="./principles/">원칙</a>
    <a href="./dictionary/">사전</a>
    <a href="./archive.html">사례</a>
    <a href="./before-after.html">Before/After</a>
    <a href="./lint.html">린터</a>
    <a href="./generator/index.html">생성기</a>
    <a href="./ontology-query.html" class="active">온톨로지</a>
  </nav>
</header>

<main>
  <h1>온톨로지 질문하기</h1>
  <p class="subtitle">KRDS 행정어 지식 그래프에 자연어로 질문하세요. Azure 없이 Claude API가 온톨로지를 해석합니다.</p>

  <div class="stats-row">
    <div class="stat"><div class="stat-num">283</div><div class="stat-lbl">행정어 인스턴스</div></div>
    <div class="stat"><div class="stat-num">3</div><div class="stat-lbl">KRDS 원칙</div></div>
    <div class="stat"><div class="stat-num">3</div><div class="stat-lbl">기관</div></div>
    <div class="stat"><div class="stat-num">118</div><div class="stat-lbl">기관-용어 연결</div></div>
  </div>

  <div class="card">
    <div class="card-title">질문 유형</div>
    <div class="chip-row">
      <button class="chip active" data-mode="ontology-query">일반 질문</button>
      <button class="chip" data-mode="ontology-explain">용어 설명</button>
      <button class="chip" data-mode="ontology-compare">기관 비교</button>
    </div>

    <div class="card-title" style="margin-top:16px">예시 질문</div>
    <div class="examples" id="examples">
      <button class="example">홈택스에서 가장 많이 쓰이는 행정어는?</button>
      <button class="example">무번역 원칙을 위반하는 용어 목록을 보여줘</button>
      <button class="example">3개 기관 모두에서 공통으로 등장하는 용어는?</button>
      <button class="example">"귀하"를 어떻게 바꾸면 좋은가?</button>
    </div>

    <textarea id="question" style="margin-top:16px" placeholder="예: 정보핵심화 원칙을 위반하는 전문용어를 모두 알려주세요" rows="3"></textarea>

    <div class="btn-row">
      <button class="btn-primary" id="askBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        온톨로지 질문
      </button>
      <button class="btn-sec" id="clearBtn">초기화</button>
      <span id="charCount" style="font-size:12px;color:var(--text-muted);margin-left:auto">0자</span>
    </div>
  </div>

  <div class="result-card" id="resultCard">
    <div class="card-title">답변</div>
    <div class="result-text" id="resultText"></div>
    <div class="status" id="status"></div>
  </div>
</main>

<footer>
  KRDS UX Writing 온톨로지 — IRI: http://krds.go.kr/ontology/uxwriting# |
  <a href="./krds-ontology.owl" style="color:var(--accent)">OWL 파일 다운로드</a> |
  <a href="https://microsoft.github.io/Ontology-Playground/#/designer" target="_blank" rel="noopener" style="color:var(--accent)">MS Ontology Playground에서 열기</a>
</footer>

<script>
// 온톨로지 컨텍스트 (OWL 파일 핵심 요약 — API 토큰 절약)
const ONTOLOGY_CONTEXT = `KRDS 행정어 온톨로지 요약 (IRI: http://krds.go.kr/ontology/uxwriting#)

[클래스]
- AdministrativeJargon: 행정어 283개 (금지 표현)
- Replacement: 권장 대체어
- Principle: 무번역·정보핵심화·심리적안전망
- Agency: 정부24·홈택스·전자가족관계등록시스템
- JargonCategory: 행정관습어(153)·전문용어(77)·과도한수식(20)·이중부정(18)·과도한경어(15)

[카테고리-원칙 매핑]
- 행정관습어, 전문용어 → 무번역 원칙 위반
- 과도한수식, 이중부정, 과도한경어 → 정보핵심화 원칙 위반

[기관별 주요 용어]
- 홈택스: 가산세(24건), 납세(16건), 부가가치세(12건), 종합소득세(10건), 원천징수(9건)
- 전가등록: 가족관계증명서(6건), 가족관계등록예규(3건), 선례(3건)
- 정부24: 급여(10건), 이의신청(4건), 상세증명서(1건)

[교차 기관 공통 용어]
- 이의신청: 정부24(4)+홈택스(1)+전가등록(5)=10건
- 분납: 정부24+홈택스+전가등록
- 귀하: 정부24+홈택스

[severity 분포]
- error: 행정관습어(153)+전문용어(68)+이중부정(18) = 239개
- warning: 과도한수식(20)+과도한경어(15) = 35개`;

const BASE_URL = (() => {
  try { return window.KRDSBasePath ? window.KRDSBasePath.siteRootPath : ''; }
  catch(e) { return ''; }
})();

let currentMode = 'ontology-query';
let abortCtrl = null;

// 모드 칩 선택
document.querySelectorAll('.chip[data-mode]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip[data-mode]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentMode = chip.dataset.mode;
  });
});

// 예시 질문 클릭
document.querySelectorAll('.example').forEach(ex => {
  ex.addEventListener('click', () => {
    document.getElementById('question').value = ex.textContent.trim();
    updateCharCount();
  });
});

// 글자 수
const qEl = document.getElementById('question');
qEl.addEventListener('input', updateCharCount);
function updateCharCount() {
  document.getElementById('charCount').textContent = qEl.value.length + '자';
}

// 초기화
document.getElementById('clearBtn').addEventListener('click', () => {
  qEl.value = '';
  updateCharCount();
  document.getElementById('resultCard').classList.remove('visible');
  if (abortCtrl) abortCtrl.abort();
});

// 질문 제출
document.getElementById('askBtn').addEventListener('click', askOntology);
qEl.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) askOntology(); });

async function askOntology() {
  const q = qEl.value.trim();
  if (!q) { qEl.focus(); return; }

  if (abortCtrl) abortCtrl.abort();
  abortCtrl = new AbortController();

  const btn = document.getElementById('askBtn');
  btn.disabled = true;

  const card = document.getElementById('resultCard');
  const text = document.getElementById('resultText');
  const status = document.getElementById('status');

  card.classList.add('visible');
  text.textContent = '';
  status.innerHTML = '<div class="dot loading"></div> AI가 온톨로지를 분석하는 중...';

  const timeoutId = setTimeout(() => {
    if (abortCtrl) abortCtrl.abort();
    status.innerHTML = '<div class="dot" style="background:#ef4444"></div> 응답 시간 초과 (15초). 다시 시도해 주세요.';
    btn.disabled = false;
  }, 15000);

  try {
    const res = await fetch(BASE_URL + '/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        agencyName: 'KRDS 온톨로지',
        agencyType: '중앙행정기관',
        mode: 'guide-draft',
        samples: [
          `[온톨로지 질문 모드: ${currentMode}]\n질문: ${q}\n\n${ONTOLOGY_CONTEXT}`
        ],
        taskBrief: '온톨로지 데이터를 기반으로 질문에 정확히 답변해 주세요. 마크다운 표와 구체적 숫자를 활용하세요.',
      }),
      signal: abortCtrl.signal,
    });

    clearTimeout(timeoutId);

    if (!res.ok) {
      const msg = res.status === 429
        ? 'AI 요청 한도를 초과했습니다. 1시간 후 다시 시도해 주세요.'
        : `서버 오류 (${res.status}). 다시 시도해 주세요.`;
      status.innerHTML = `<div class="dot" style="background:#ef4444"></div> ${msg}`;
      btn.disabled = false;
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '', accumulated = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed.startsWith('data:')) continue;
        const jsonStr = trimmed.slice(5).trim();
        if (!jsonStr || jsonStr === '[DONE]') continue;
        try {
          const evt = JSON.parse(jsonStr);
          if (evt.type === 'chunk') {
            accumulated += evt.text;
            text.textContent = accumulated + '▋';
          } else if (evt.type === 'done') {
            text.textContent = accumulated;
            status.innerHTML = '<div class="dot"></div> 답변 완료';
          } else if (evt.type === 'error') {
            status.innerHTML = '<div class="dot" style="background:#ef4444"></div> AI 처리 오류';
          }
        } catch(e) {}
      }
    }
    if (accumulated) text.textContent = accumulated;
    if (!status.textContent.includes('완료')) {
      status.innerHTML = '<div class="dot"></div> 답변 완료';
    }
  } catch(e) {
    clearTimeout(timeoutId);
    if (e.name === 'AbortError') return;
    const offline = !navigator.onLine;
    status.innerHTML = `<div class="dot" style="background:#ef4444"></div> ${offline ? '오프라인 상태 — 인터넷 연결을 확인해 주세요.' : '연결 오류. 다시 시도해 주세요.'}`;
  }

  btn.disabled = false;
}
</script>
</body>
</html>
